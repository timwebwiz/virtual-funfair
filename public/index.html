<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Virtual Funfair</title>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
<style>
 body{margin:0;overflow:hidden;font-family:system-ui,sans-serif;background:#10142a;color:#fff}
 #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#ff7eb3,#7a5cff)}
 .card{background:#0009;padding:24px;border-radius:16px;text-align:center;max-width:340px}
 button,input{font-size:16px;padding:10px;margin:6px;border-radius:8px;border:0}
 button{background:#ffd23f;font-weight:700;cursor:pointer}
 video,canvas#snap{width:240px;border-radius:12px;display:none;margin:auto}
 #hud{position:fixed;top:8px;left:8px;font-size:14px;text-shadow:0 0 4px #000}
 #chat{position:fixed;bottom:8px;left:8px;display:none}
 #joy{position:fixed;bottom:20px;right:20px;width:120px;height:120px;border-radius:50%;background:#fff3;display:none;touch-action:none}
 #radio{position:fixed;top:8px;right:8px;width:300px;font:12px monospace;color:#7CFC00;background:#000a;padding:6px;border-radius:8px;pointer-events:none}
 #radio div{margin:2px 0}
 #acts{position:fixed;bottom:30px;left:20px;display:none;gap:12px}
 #acts button{width:72px;height:72px;border-radius:50%;font-size:28px;padding:0;opacity:.85;touch-action:manipulation}
 #nub{position:absolute;width:50px;height:50px;border-radius:50%;background:#fff8;left:35px;top:35px}
</style></head><body>
<div id="ui"><div class="card">
 <h1>🎡 Virtual Funfair</h1>
 <p>Add a photo of yourself to create your 3-D avatar.</p>
 <input id="name" placeholder="Your name" maxlength="20"><br>
 <input id="file" type="file" accept="image/*" capture="user"><br>
 <button id="cam">📷 Use camera</button><button id="shot" style="display:none">Capture</button>
 <video id="vid" autoplay playsinline muted></video><canvas id="snap" width="256" height="256"></canvas>
 <br><button id="go">Enter the Funfair</button>
 <p id="msg" style="font-size:12px"></p>
</div></div>
<div id="hud">WASD / arrows / joystick: move · E: shout (attracts security) · F: faint · H: injured · C: severe emergency (medic + ambulance)</div>
<input id="chat" placeholder="Say something + Enter" maxlength="120">
<div id="radio"><b>📻 Security radio</b></div>
<div id="acts"><button id="bShout" aria-label="Shout">📢</button><button id="bFaint" aria-label="Faint">😵</button><button id="bHurt" aria-label="Hurt">🩹</button><button id="bCrit" aria-label="Severe emergency">🚑</button></div>
<div id="joy"><div id="nub"></div></div>
<script type="module" src="main.js"></script>
</body></html>
